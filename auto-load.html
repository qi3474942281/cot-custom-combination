<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在加载汉化与图片...</title>
<style>
body { background:#111; color:#eee; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
#msg { font-size:16px; text-align:center; white-space:pre-wrap; max-width:90%; }
</style>
</head>
<body>
<div id="msg">正在自动加载汉化与图片包，请稍候...</div>
<script>
async function autoLoad() {
  const mods = [
    { name: 'ModI18N.mod.zip', url: 'mods/ModI18N.mod.zip' },
    { name: 'CoTGameOriginalImagePack.mod.zip', url: 'mods/CoTGameOriginalImagePack.mod.zip' }
  ];

  const dbName = 'ModLoader_IndexDBLoader';
  const storeName = 'ModLoader_IndexDBLoader';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(dbName, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(storeName)) {
          db.createObjectStore(storeName);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function arrayBufferToBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const len = bytes.byteLength;
    for (let i = 0; i < len; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  }

  try {
    const db = await openDB();
    const list = [];
    for (const mod of mods) {
      document.getElementById('msg').textContent = `正在下载 ${mod.name}...`;
      const resp = await fetch(mod.url);
      if (!resp.ok) throw new Error('fetch failed: ' + mod.url);
      const buf = await resp.arrayBuffer();
      const base64 = arrayBufferToBase64(buf);
      const key = `modDataIndexDBZip:${mod.name}`;
      
      await new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.put(base64, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      list.push(mod.name);
    }

    await new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      store.put(JSON.stringify(list), 'modDataIndexDBZipList');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });

    document.getElementById('msg').textContent = '加载完成，正在进入游戏...';
    setTimeout(() => {
      location.href = 'vanilla/index.html';
    }, 1000);
  } catch (e) {
    document.getElementById('msg').textContent = '加载失败，请截图给我\n' + e.toString();
  }
}
autoLoad();
</script>
</body>
</html>
