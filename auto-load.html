<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在加载汉化与图片...</title>
<style>
body { background:#111; color:#eee; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
#msg { font-size:16px; text-align:center; white-space:pre-wrap; max-width:90%; }
</style>
</head>
<body>
<div id="msg">正在自动加载汉化与图片包，请稍候...</div>
<script>
async function autoLoad() {
  const build = 'text-hotfix-1';
  const mods = [
    { name: 'ModI18N.mod.zip', url: 'mods/ModI18N.mod.zip' },
    { name: 'CoTTextHotfix.mod.zip', url: 'mods/CoTTextHotfix.mod.zip' },
    { name: 'CoTGameOriginalImagePack.mod.zip', url: 'mods/CoTGameOriginalImagePack.mod.zip' },
    { name: 'NPCVisualization.mod.zip', url: 'mods/NPCVisualization.mod.zip', legacyNames: ["Mes' NPC visualization mod"] }
  ];

  const dbName = 'ModLoader_IndexDBLoader';
  const storeName = 'ModLoader_IndexDBLoader';
  // These keys are configured by vanilla/index.html, rather than the loader defaults.
  const listKey = 'CoTmodDataIndexDBZipList';
  const zipKeyPrefix = 'CoTmodDataIndexDBZip';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(dbName, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(storeName)) {
          db.createObjectStore(storeName);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  let db;
  try {
    const downloads = [];
    for (const mod of mods) {
      document.getElementById('msg').textContent = `正在下载 ${mod.name}...`;
      const resp = await fetch(`${mod.url}?build=${build}`, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`下载失败（HTTP ${resp.status}）：${mod.url}`);
      const buf = await resp.arrayBuffer();
      // Match IndexDBLoader.addMod(): store ZIP bytes without a large base64 conversion.
      downloads.push({ name: mod.name, bytes: new Uint8Array(buf) });
    }

    db = await openDB();
    await new Promise((resolve, reject) => {
      // Commit the ZIPs and their list together so a failed download cannot leave
      // an incomplete installation. Keep any other mods installed by the player.
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const request = store.get(listKey);
      request.onsuccess = () => {
        let previous = [];
        try {
          const parsed = JSON.parse(request.result || '[]');
          if (Array.isArray(parsed) && parsed.every(name => typeof name === 'string')) {
            previous = parsed;
          }
        } catch (_) {
          // A malformed old list must not prevent restoring the bundled mods.
        }
        // A manually installed older copy uses its boot name as the key. Keep
        // that copy out of the enabled list so it cannot override this update.
        const legacyNames = new Set(mods.flatMap(mod => mod.legacyNames || []));
        const list = [...new Set([...mods.map(mod => mod.name), ...previous.filter(name => !legacyNames.has(name))])];
        for (const mod of downloads) {
          store.put(mod.bytes, `${zipKeyPrefix}:${mod.name}`);
        }
        store.put(JSON.stringify(list), listKey);
      };
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('模组保存事务已中止'));
    });

    document.getElementById('msg').textContent = '加载完成，正在进入游戏...';
    setTimeout(() => {
      location.href = `vanilla/index.html?build=${build}`;
    }, 1000);
  } catch (e) {
    document.getElementById('msg').textContent = '加载失败，请截图给我\n' + e.toString();
  } finally {
    if (db) db.close();
  }
}
autoLoad();
</script>
</body>
</html>
