name: Validate CoT 0.8.5e upgrade
on:
  push:
    branches: ["upgrade/cot-085e"]
permissions:
  contents: write
concurrency:
  group: cot-085e-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve old engine for save recognition test
        run: |
          mkdir .compat-old
          git archive origin/backup/cot080h-before-085e-20261123 vanilla mods modList.json | tar -x -C .compat-old
      - name: Build pinned upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python update_upstream.py --force
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test library
        run: npm install --no-save playwright@1.56.1
      - name: Test Chromium compatibility
        env:
          COT_ENGINE: chromium
          COT_SYSTEM_CHROME: "1"
        run: node tools/test_upgrade.cjs
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Test WebKit compatibility
        env:
          COT_ENGINE: webkit
        run: node tools/test_upgrade.cjs
      - name: Commit validated candidate on upgrade branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vanilla mods
          git diff --cached --quiet && exit 0
          git commit -m "Update to verified Chinese 0.8.5e with portraits, hotfix and save backup"
          git push origin HEAD:upgrade/cot-085e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-test-results
          path: upgrade-test-results.json
