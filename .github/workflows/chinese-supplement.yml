name: Audit and validate Chinese supplement
on:
  push:
    branches: ["improve/chinese-085e"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: node tools/audit_chinese.cjs
      - name: Save audit on working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chinese-audit.json
          git commit -m "Record runtime localization audit"
          git push origin HEAD
